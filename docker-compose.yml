services:

  ingestion:
    build:
      context: ./ingestion
    image: tfg-topics-ingestion
    container_name: tfg_topics_ingestion
    profiles:
      - ingestion
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DATA_DIR=/data
      - REPOS_CSV_FILE_NAME=repos.csv
    volumes:
      - ./data:/data