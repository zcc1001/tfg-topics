services:
  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    image: tfg-topics-ingestion
    container_name: tfg_topics_ingestion
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      # Mapea la carpeta 'data' local a la carpeta 'data' dentro del contenedor.
      # Esto asegura que los ficheros Parquet generados se guarden en tu máquina.
      - ./ingestion/data:/app/data
    command: python ingestion/src/main.py
