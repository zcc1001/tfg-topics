name: CI - TFG Project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - backend-ingestion
          - backend-processing

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Lint (flake8)
        run: |
          if [ -d src ]; then
            flake8 src
          else
            flake8 .
          fi

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pytest
          else
            echo "No tests directory found, skipping tests."
          fi

  sonarcloud:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend-ingestion/requirements.txt
          pip install -r backend-ingestion/requirements-dev.txt

      - name: Install processing dependencies
        run: |
          pip install -r backend-processing/requirements.txt
          pip install -r backend-processing/requirements-dev.txt

      - name: Generate ingestion coverage report
        run: |
          PYTHONPATH=backend-ingestion/src pytest backend-ingestion/tests \
            --cov=backend-ingestion/src \
            --cov-report=xml:backend-ingestion/coverage.xml

      - name: Generate processing coverage report
        run: |
          PYTHONPATH=backend-processing/src pytest backend-processing/tests \
            --cov=backend-processing/src \
            --cov-report=xml:backend-processing/coverage.xml

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
