name: CI - TFG Project

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - backend-ingestion
          - backend-processing

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest flake8

      - name: Lint (flake8)
        run: |
          if [ -d src ]; then
            flake8 src --max-line-length=100
          else
            flake8 .
          fi

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pytest
          else
            echo "No tests directory found, skipping tests."
          fi

  validate-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose file
        run: |
          docker compose version
          docker compose config

  build-images:
    runs-on: ubuntu-latest
    needs: validate-compose

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ingestion image
        run: docker build ./backend-ingestion -t tfg-topics-ingestion

      - name: Build processing image
        run: docker build ./backend-processing -t tfg-topics-processing

      - name: Build frontend image
        run: docker build ./frontend-web -t tfg-topics-frontend
