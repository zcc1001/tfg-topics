name: Release - TFG Project

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  validate-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose file
        run: |
          docker compose version
          docker compose config

  build-and-push-images:
    runs-on: ubuntu-latest
    needs: validate-compose

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ingestion image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-ingestion
          push: true
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tfg-topics-ingestion:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository_owner }}/tfg-topics-ingestion:latest

      - name: Export ingestion image
        run: |
          docker save ghcr.io/${{ github.repository_owner }}/tfg-topics-ingestion:${{ github.event.release.tag_name }} | gzip \
            > tfg-topics-ingestion-${{ github.event.release.tag_name }}.tar.gz

      - name: Upload ingestion asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: tfg-topics-ingestion-${{ github.event.release.tag_name }}.tar.gz

      - name: Build and push processing image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-processing
          push: true
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tfg-topics-processing:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository_owner }}/tfg-topics-processing:latest

      - name: Export processing image
        run: |
          docker save ghcr.io/${{ github.repository_owner }}/tfg-topics-processing:${{ github.event.release.tag_name }} | gzip \
            > tfg-topics-processing-${{ github.event.release.tag_name }}.tar.gz

      - name: Upload processing asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: tfg-topics-processing-${{ github.event.release.tag_name }}.tar.gz

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-web
          push: true
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tfg-topics-frontend:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository_owner }}/tfg-topics-frontend:latest

      - name: Export frontend image
        run: |
          docker save ghcr.io/${{ github.repository_owner }}/tfg-topics-frontend:${{ github.event.release.tag_name }} | gzip \
            > tfg-topics-frontend-${{ github.event.release.tag_name }}.tar.gz

      - name: Upload frontend asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: tfg-topics-frontend-${{ github.event.release.tag_name }}.tar.gz
