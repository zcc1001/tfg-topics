name: Release - TFG Project

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  validate-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose file
        run: |
          docker compose version
          docker compose config

  build-and-push-images:
    runs-on: ubuntu-latest
    needs: validate-compose

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ingestion image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-ingestion
          push: true
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tfg-topics-ingestion:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository_owner }}/tfg-topics-ingestion:latest

      - name: Build and push processing image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-processing
          push: true
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tfg-topics-processing:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository_owner }}/tfg-topics-processing:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-web
          push: true
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tfg-topics-frontend:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository_owner }}/tfg-topics-frontend:latest

      - name: Add image links to release notes
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.payload.release.tag_name;
            const owner = context.repo.owner;
            const releaseId = context.payload.release.id;
            const ownerType = context.payload.repository.owner.type === 'Organization' ? 'orgs' : 'users';

            const packagePageBase = `https://github.com/${ownerType}/${owner}/packages/container`;
            const imageRefs = [
              {
                name: 'ingestion',
                package: 'tfg-topics-ingestion',
                image: `ghcr.io/${owner}/tfg-topics-ingestion:${tag}`,
              },
              {
                name: 'processing',
                package: 'tfg-topics-processing',
                image: `ghcr.io/${owner}/tfg-topics-processing:${tag}`,
              },
              {
                name: 'frontend',
                package: 'tfg-topics-frontend',
                image: `ghcr.io/${owner}/tfg-topics-frontend:${tag}`,
              },
            ];

            const links = imageRefs
              .map(
                ({ name, package: packageName, image }) =>
                  `- [${name}](${packagePageBase}/${packageName}) - \`${image}\``,
              )
              .join('\n');

            const startMarker = '<!-- ghcr-image-links:start -->';
            const endMarker = '<!-- ghcr-image-links:end -->';
            const section = `\n\n${startMarker}\n## Docker images\n\n${links}\n${endMarker}`;

            const release = await github.rest.repos.getRelease({
              owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });

            const currentBody = release.data.body ?? '';
            const cleanedBody = currentBody.replace(
              new RegExp(`\\n\\n${startMarker}[\\s\\S]*?${endMarker}`),
              '',
            );
            const body = `${cleanedBody}${section}`;

            await github.rest.repos.updateRelease({
              owner,
              repo: context.repo.repo,
              release_id: releaseId,
              body,
            });
