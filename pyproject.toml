[tool.black]
line-length = 88
target-version = ["py310"]
exclude = '''
/(
    \.git
  | \.venv
  | \.idea
  | \.vscode
  | data
  | docs
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
src_paths = [
    "backend-processing/src",
    "backend-ingestion/src",
    "frontend-web/src"
]
known_first_party = [
    "processing",
    "ingestion",
    "webapp"
]
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
namespace_packages = true

mypy_path = [
    "backend-processing/src",
    "backend-ingestion/src",
    "frontend-web/src"
]

warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = false
